<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | Sky Blue Digital Service</title>

  <meta
    name="description"
    content="Sign in to your Sky Blue Digital Service business account."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f8fc;
      color: #122033;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5eaf1;
      padding: 20px 6%;
    }

    .logo {
      color: #1261d6;
      font-size: 21px;
      font-weight: 800;
    }

    .container {
      max-width: 500px;
      margin: 70px auto;
      padding: 0 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e1e7ef;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 15px 45px rgba(24, 55, 90, 0.08);
    }

    .badge {
      display: inline-block;
      background: #e8f1ff;
      color: #1261d6;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .intro {
      color: #66758a;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd5e1;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1261d6;
      box-shadow: 0 0 0 3px rgba(18, 97, 214, 0.10);
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      background: #1261d6;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .button:hover {
      background: #0d4fae;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      background: #f5f8fc;
      color: #43536a;
      font-size: 14px;
      line-height: 1.5;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #66758a;
      line-height: 2;
    }

    .links a {
      color: #1261d6;
      font-weight: 700;
      text-decoration: none;
    }

    .security {
      text-align: center;
      margin-top: 25px;
      color: #7a8798;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 35px auto;
      }

      .card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Sky Blue Digital Service</div>
</header>

<main class="container">

  <div class="card">

    <div class="badge">CUSTOMER PORTAL</div>

    <h1>Welcome back</h1>

    <p class="intro">
      Sign in to manage your Sky Blue Digital Service account
      and access your business platform.
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="email">Email address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="button" type="submit">
        Sign In
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="links">
      <a href="/signup.html">Create a business account</a>
      <br>
      <a href="/subscribe.html">View subscription plans</a>
    </div>

    <div class="security">
      Secure account authentication will be connected to the
      Sky Blue Digital Service platform.
    </div>

  </div>

</main>

<script>
  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    message.style.display = "block";
    message.textContent =
      "Secure login is being connected to your Sky Blue Digital Service account system.";
  });
</script>

</body>
  </html>
