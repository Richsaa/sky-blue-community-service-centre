<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard | Sky Blue Digital Service</title>

  <meta
    name="description"
    content="Sky Blue Digital Service business dashboard."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f8fc;
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e3e8f0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 17px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      color: #1264d8;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-email {
      color: #64748b;
      font-size: 13px;
    }

    .logout {
      border: 1px solid #d5ddea;
      background: #ffffff;
      color: #334155;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout:hover {
      background: #f4f7fb;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .welcome {
      margin-bottom: 28px;
    }

    .welcome-badge {
      display: inline-block;
      background: #e7f0ff;
      color: #1264d8;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
      margin-bottom: 12px;
    }

    h1 {
      color: #111827;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
    }

    .status-card {
      background: #ffffff;
      border: 1px solid #e1e7f0;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 8px 25px rgba(20, 60, 120, .05);
    }

    .status-title {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 5px;
    }

    .status-value {
      font-size: 20px;
      font-weight: 800;
      color: #172033;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 20px;
      background: #fff7e6;
      color: #9a6700;
      font-size: 12px;
      font-weight: 800;
    }

    .section-title {
      font-size: 19px;
      color: #172033;
      margin: 30px 0 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
